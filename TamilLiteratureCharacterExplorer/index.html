<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>தமிழ் இலக்கியக் கதாபாத்திரத் தேடல்</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>தமிழ் இலக்கியக் கதாபாத்திரத் தேடல்</h1>
  <p>Tamil Literature Character Explorer</p>
</header>
<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="கதாபாத்திரத்தின் பெயரைத் தேடுங்கள்..." aria-label="Search characters">
    <select id="category" aria-label="Filter by literary work"><option value="">அனைத்து இலக்கியங்களும்</option></select>
  </div>
  <p class="stats" id="stats">தரவு ஏற்றப்படுகிறது...</p>
  <section id="list" class="grid" aria-live="polite"></section>
  <section id="profile"></section>
</main>
<footer>தமிழ் இலக்கியத் தகவல்களைத் தேடி அறியும் கல்வித் திட்டம்</footer>
<script src="script.js"></script>
</body>
</html>
