
<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>தமிழ் இலக்கியக் கதாபாத்திரங்கள்</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Noto Sans Tamil", Latha, sans-serif;
      background: #f7f2e8;
      color: #302319;
      line-height: 1.8;
    }

    header {
      background: #4b291b;
      color: #fff5e5;
      text-align: center;
      padding: 30px 15px;
      border-bottom: 5px solid #bd8b45;
    }

    header h1 { margin: 0 0 8px; }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cdbba3;
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 18px;
    }

    .card {
      background: #fffdf8;
      padding: 20px;
      border: 1px solid #e0d2bd;
      border-radius: 12px;
      overflow-wrap: anywhere;
    }

    .card h2 { color: #7a3e20; margin-top: 5px; }

    h3 {
      color: #754322;
      margin-bottom: 4px;
      font-size: 1rem;
    }

    .category {
      display: inline-block;
      background: #f0e3ce;
      color: #673c20;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 13px;
    }

    .reference {
      background: #f8f0e3;
      border-left: 3px solid #bd8b45;
      padding: 10px;
      margin: 10px 0;
    }

    .muted { color: #6d6257; font-size: 14px; }

    a { color: #88461e; overflow-wrap: anywhere; }

    .message {
      background: white;
      padding: 20px;
      border-radius: 10px;
      grid-column: 1 / -1;
    }

    @media (max-width: 600px) {
      .controls { grid-template-columns: 1fr; }
      main { padding: 12px; }
    }
  </style>
</head>

<body>
<header>
  <h1>தமிழ் இலக்கியக் கதாபாத்திரங்கள்</h1>
  <p>தமிழ் இலக்கியம், கதாபாத்திரங்கள், உறவுகள் மற்றும் மூலநூல் குறிப்புகளை ஆராய்வோம்.</p>
</header>

<main>
  <div class="controls">
    <input id="search" type="search"
      placeholder="பெயர், நூல், ஆசிரியர் அல்லது தகவலைத் தேடு...">

    <select id="category">
      <option value="">அனைத்து இலக்கியங்களும்</option>
    </select>
  </div>

  <section id="results">
    <p class="message">தகவல்கள் ஏற்றப்படுகின்றன...</p>
  </section>
</main>

<script>
  const results = document.getElementById("results");
  const search = document.getElementById("search");
  const category = document.getElementById("category");

  let characters = [];

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[c]);
  }

  function makeLinks(item) {
    let links = [];

    if (item.wikipedia_url) {
      links.push(
        `<li><a href="${esc(item.wikipedia_url)}"
        target="_blank" rel="noopener noreferrer">
        Wikipedia</a></li>`
      );
    }

    if (Array.isArray(item.other_sources)) {
      item.other_sources.forEach((url, i) => {
        if (url) {
          links.push(
            `<li><a href="${esc(url)}"
            target="_blank" rel="noopener noreferrer">
            கூடுதல் ஆதாரம் ${i + 1}</a></li>`
          );
        }
      });
    }

    return links.length
      ? `<h3>வெளி ஆதாரங்கள்</h3><ul>${links.join("")}</ul>`
      : "";
  }

  function makeReferences(item) {
    const refs = Array.isArray(item.literary_references)
      ? item.literary_references : [];

    let html = refs.map(ref => `
      <div class="reference">
        <strong>${esc(ref.section || "இலக்கியக் குறிப்பு")}</strong>
        ${ref.reference_status
          ? `<p>${esc(ref.reference_status)}</p>` : ""}
        ${ref.canto
          ? `<p>காதை: ${esc(ref.canto)}</p>` : ""}
        ${ref.verse
          ? `<p>பாடல் / வரி: ${esc(ref.verse)}</p>` : ""}
        ${ref.quote
          ? `<p>மூலவரி: ${esc(ref.quote)}</p>` : ""}
        ${ref.source_url
          ? `<a href="${esc(ref.source_url)}"
             target="_blank" rel="noopener noreferrer">
             மூல ஆதாரம்</a>` : ""}
      </div>
    `).join("");

    if (!html) {
      html = '<p class="muted">மேற்கோள் இன்னும் சேர்க்கப்படவில்லை.</p>';
    }

    return html;
  }

  function makeCard(item) {
    let relationships = "";

    if (item.relationships &&
        typeof item.relationships === "object") {
      const rows = Object.entries(item.relationships).map(([key, value]) => {
        const display = Array.isArray(value)
          ? value.join(", ") : value;

        return `<li><strong>${esc(key.replaceAll("_", " "))}:</strong>
          ${esc(display)}</li>`;
      });

      relationships = rows.length ? `<ul>${rows.join("")}</ul>` : "";
    }

    return `
      <article class="card">
        <span class="category">${esc(item.category)}</span>
        <h2>${esc(item.name)}</h2>

        <p class="muted">
          ${item.author ? "ஆசிரியர்: " + esc(item.author) : ""}
          ${item.character_type ? " · " + esc(item.character_type) : ""}
        </p>

        <p>${esc(item.description)}</p>

        ${item.role_in_story ? `
          <h3>கதையில் பங்கு</h3>
          <p>${esc(item.role_in_story)}</p>` : ""}

        ${relationships ? `
          <h3>கதாபாத்திர உறவுகள்</h3>
          ${relationships}` : ""}

        <h3>இலக்கிய மேற்கோள்கள்</h3>
        ${makeReferences(item)}

        ${item.verification_status ? `
          <h3>சரிபார்ப்பு நிலை</h3>
          <p class="muted">${esc(item.verification_status)}</p>` : ""}

        ${makeLinks(item)}
      </article>
    `;
  }

  function render() {
    const term = search.value.trim().toLocaleLowerCase("ta");
    const selected = category.value;

    const filtered = characters.filter(item => {
      const categoryMatch = !selected || item.category === selected;

      const refs = Array.isArray(item.literary_references)
        ? item.literary_references.flatMap(ref => [
            ref.section, ref.reference_status,
            ref.canto, ref.verse, ref.quote
          ])
        : [];

      const searchable = [
        item.name, item.category, item.author,
        item.character_type, item.description,
        item.role_in_story, item.verification_status, ...refs
      ].filter(Boolean).join(" ").toLocaleLowerCase("ta");

      return categoryMatch && searchable.includes(term);
    });

    results.innerHTML = filtered.length
      ? filtered.map(makeCard).join("")
      : '<p class="message">பொருத்தமான கதாபாத்திரம் கிடைக்கவில்லை.</p>';
  }

  async function loadData() {
    try {
      const response = await fetch("./characters.json", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("characters.json file கிடைக்கவில்லை.");
      }

      const data = await response.json();

      characters = Array.isArray(data)
        ? data
        : (Array.isArray(data.characters) ? data.characters : []);

      if (!characters.length) {
        throw new Error("JSON file-ல் பதிவுகள் இல்லை.");
      }

      const categories = [...new Set(
        characters.map(item => item.category).filter(Boolean)
      )].sort((a, b) => a.localeCompare(b, "ta"));

      categories.forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        category.appendChild(option);
      });

      render();
    } catch (error) {
      results.innerHTML = `
        <p class="message">
          தகவல்களை ஏற்ற முடியவில்லை: ${esc(error.message)}
          <br>index.html மற்றும் characters.json சரியான இடத்தில் உள்ளனவா எனப் பார்க்கவும்.
        </p>`;
    }
  }

  search.addEventListener("input", render);
  category.addEventListener("change", render);

  loadData();
</script>
</body>
</html>
